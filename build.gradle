plugins {
    id 'java'
    id 'idea'
    id 'fabric-loom' version '1.11-SNAPSHOT' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    
    java {
        withSourcesJar()
    }
    
    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
    }
    
    repositories {
        mavenCentral()
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds all Fabric versions'
    dependsOn subprojects.findAll { it.name != 'common' }
        .collect { it.tasks.named('build') }
}

tasks.register('publishAllToModrinth') {
    group = 'publishing'
    description = 'Publishes all Fabric versions to Modrinth'
    dependsOn subprojects.findAll { it.name != 'common' }
        .collect { it.tasks.named('modrinth') }
}

tasks.register('tagRelease', Exec) {
    group = 'publishing'
    description = 'Creates a git tag from mod_version'
    commandLine 'git', 'tag', "v${mod_version}"
}
